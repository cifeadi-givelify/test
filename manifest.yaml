---
notifications_slack_channel: "#dd"
import_ansible_secrets: "False"
execute_smoke_tests: "False"
# helm_repo_branch: master

services:
  - service: test
    template: laravel-api-app
    app:
      dockerfile: Dockerfile
    jobs:
      qa_jobs:
        test:
          schedule: "1 1 1 1 1"
          command: "p"
          suspend: false
      prod_jobs:
        test:
          schedule: "1 1 1 1 1"
          command: "p"
          suspend: false

